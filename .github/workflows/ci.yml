name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: vitest
        run: npm test
      - name: Confirm writeup constraints
        run: |
          words=$(wc -w < docs/writeup.md)
          echo "writeup word count: $words"
          if [ "$words" -gt 1500 ]; then
            echo "::error::Writeup exceeds 1500 word cap ($words)"
            exit 1
          fi
          if ! grep -q "Built with Gemma" docs/writeup.md; then
            echo "::error::Writeup must contain literal 'Built with Gemma'"
            exit 1
          fi
          echo "writeup gates ok"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci || npm install --no-audit --no-fund
      - run: npx tsc -b --noEmit
