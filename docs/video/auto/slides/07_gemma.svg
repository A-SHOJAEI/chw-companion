<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"
     font-family="Inter, system-ui, sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#FBF6E8"/>
      <stop offset="100%" stop-color="#F4ECD8"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9532A"/>
      <stop offset="100%" stop-color="#E8A33D"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="260" height="14" fill="url(#ribbon)"/>
  <rect x="0" y="0" width="14" height="260" fill="url(#ribbon)"/>

  <!-- Brand mark -->
  <g transform="translate(96 96)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="#C9532A"/>
    <text x="28" y="40" text-anchor="middle" font-family="Fraunces, serif"
          font-weight="700" font-size="28" fill="#F4ECD8">C</text>
  </g>
  <text x="172" y="135" font-family="Inter, sans-serif" font-weight="500"
        font-size="16" fill="#6B6F76" letter-spacing="3">CHW COMPANION</text>

  <!-- Beat chip -->
  <g transform="translate(96 968)">
    <circle cx="8" cy="8" r="8" fill="#C9532A"/>
    <text x="28" y="14" font-family="Inter, sans-serif" font-weight="600"
          font-size="14" fill="#6B6F76" letter-spacing="2">07 — WHY GEMMA 4</text>
  </g>

  <text x="96" y="240" font-family="Fraunces, serif" font-weight="700"
        font-size="80" fill="#1B2A4E">Why Gemma 4.</text>
  <text x="96" y="306" font-family="Inter, sans-serif" font-weight="400"
        font-size="28" fill="#6B6F76">Three constraints the model had to meet:</text>

  <g font-family="Inter, sans-serif" fill="#1B2A4E">
    <g transform="translate(96 380)">
      <circle cx="22" cy="22" r="22" fill="#C9532A"/>
      <text x="22" y="32" text-anchor="middle" font-weight="700"
            font-size="22" fill="#F4ECD8">1</text>
      <text x="64" y="22" font-weight="700" font-size="30">Multimodal in one forward pass</text>
      <text x="64" y="56" font-weight="400" font-size="22" fill="#6B6F76">no Whisper → text → LLM pipeline; audio + image + text together</text>
    </g>
    <g transform="translate(96 490)">
      <circle cx="22" cy="22" r="22" fill="#C9532A"/>
      <text x="22" y="32" text-anchor="middle" font-weight="700"
            font-size="22" fill="#F4ECD8">2</text>
      <text x="64" y="22" font-weight="700" font-size="30">Wide language coverage, including Hausa</text>
      <text x="64" y="56" font-weight="400" font-size="22" fill="#6B6F76">most multimodal frontier models still miss low-resource languages</text>
    </g>
    <g transform="translate(96 600)">
      <circle cx="22" cy="22" r="22" fill="#C9532A"/>
      <text x="22" y="32" text-anchor="middle" font-weight="700"
            font-size="22" fill="#F4ECD8">3</text>
      <text x="64" y="22" font-weight="700" font-size="30">Open weights, fits on consumer Android</text>
      <text x="64" y="56" font-weight="400" font-size="22" fill="#6B6F76">int4 quant runs on 8 GB RAM phones; Apache 2.0 license</text>
    </g>
  </g>

  <text x="96" y="780" font-family="Fraunces, serif" font-weight="700"
        font-size="40" fill="#C9532A">Only Gemma 4 met all three.</text>

  <g transform="translate(96 860)">
    <rect x="0" y="0" width="1280" height="64" rx="14" fill="#1B2A4E"/>
    <text x="32" y="42" font-family="Inter, sans-serif" font-weight="700"
          font-size="22" fill="#F4ECD8" letter-spacing="3">
      GEMMA 4 E4B · 4.5B effective params · 128K context · 140 languages · Apache 2.0
    </text>
  </g>

</svg>
